<!-- RelayPay favicon: the same two-arrow mark as the header wordmark, white on black, in a
     rounded square so it reads on both light and dark browser tabs. The black matches the
     logo colour in tokens.css (an image file can't read CSS variables).
     No double hyphens in this comment: XML forbids them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0a0a0a" />
  <path d="M8 12h13l-3.5-3.5M24 20H11l3.5 3.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
