<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RelayPay Support</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="page">
      <p class="logo">RelayPay</p>
      <section class="panel" aria-labelledby="title">
        <h1 id="title" class="logo" hidden>RelayPay voice support</h1>
        <p class="intro">Speak with RelayPay support about payments, payouts, invoicing and your account.</p>

        <p class="status" id="status" data-state="loading" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Loading…</span>
        </p>

        <div class="actions">
          <button type="button" class="button-primary" id="call-button" disabled>Start call</button>
          <button type="button" class="button-secondary" id="mute-button" hidden aria-pressed="false">Mute</button>
        </div>

        <div class="error" id="error" role="alert" hidden>
          <p id="error-text"></p>
          <details id="error-details-wrap" hidden>
            <summary>Technical details</summary>
            <p id="error-details"></p>
          </details>
        </div>

        <div class="caption" id="caption" hidden>
          <p class="caption-label">Agent said</p>
          <p class="caption-text" id="caption-text" aria-live="polite"></p>
        </div>
      </section>
      <p class="note">This call uses your microphone. Please don't say full card or bank account numbers.</p>
    </main>
  </body>
</html>
